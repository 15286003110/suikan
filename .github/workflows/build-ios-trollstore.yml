name: Build iOS IPA (TrollStore)

on:
  workflow_dispatch:        # 手动触发，随时点一下就能编
  push:
    branches: [ master, main ]

jobs:
  build-ios:
    runs-on: macos-latest   # GitHub 提供的云端 macOS，自带 Xcode
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'   # 与手机版/手机APK 同一套 SDK

      - name: Install deps
        working-directory: simple_live_app
        run: flutter pub get

      - name: Pod install
        working-directory: simple_live_app/ios
        run: pod install --repo-update

      # TrollStore 会自己重签名，CI 不必配 Apple 证书。
      # 关闭 Xcode 签名，避免无证书导致 build 失败。
      - name: Disable code signing (unsigned, for TrollStore)
        working-directory: simple_live_app/ios
        run: |
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = "AUTOMATIC"/CODE_SIGN_STYLE = "MANUAL"/g' Runner.xcodeproj/project.pbxproj

      - name: Build iOS app (release)
        working-directory: simple_live_app
        run: flutter build ios --release

      # 把编译产物打成 ipa（TrollStore 直接吃未签名 ipa 并重新签名）
      - name: Package IPA
        working-directory: simple_live_app
        run: |
          mkdir -p build/ios/Payload
          cp -r build/ios/Release-iphoneos/Runner.app build/ios/Payload/
          cd build/ios && zip -r SimpleLive.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-iOS
          path: simple_live_app/build/ios/SimpleLive.ipa

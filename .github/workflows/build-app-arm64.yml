name: build-app-arm64

on:
  workflow_dispatch:

jobs:
  build-app-arm64:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Read version
        id: version
        run: |
          ver=$(grep '^version:' suikan_app/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "APP_VERSION=$ver" >> "$GITHUB_ENV"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "using version: $ver"

      - name: pub get
        working-directory: suikan_app
        run: flutter pub get

      - name: Build arm64 APK
        working-directory: suikan_app
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Rename APK
        run: |
          cd suikan_app/build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk "Suikan_arm64_${{ steps.version.outputs.version }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Suikan-app-arm64
          path: suikan_app/build/app/outputs/flutter-apk/Suikan_arm64_*.apk
